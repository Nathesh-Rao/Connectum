    const dur = Math.abs(wp[k][0] - wp[k-1][0]) / SPEED;
    plan.push({ kind: 'move', t0: T, t1: T + dur, a: wp[k-1][0], b: wp[k][0] }); T += dur;
    if (wp[k][2] === 'e') { if (k === wp.length - 1) { plan.push({ kind: 'out', t0: T, t1: T + EDGE, s: wp[k][0] }); T += EDGE; } else T += 0.2; }
    else { hits.push({ t: T, icon: wp[k][2] }); T += wp[k][1]; }
  }
  const PERIOD = T + 0.9;
  const HL = 0.95;                    // highlight length
  const iconBuilding = ['fa', 'tw', 'mu'];

  const tf = (x, y, s) => `translate(${x} ${y}) scale(${s}) translate(${-x} ${-y})`;

  const gl = [[...document.querySelectorAll('#bL .cell')], [...document.querySelectorAll('#bC .bar')], []];
  const shG = $('shG'), shCk = $('shCk');
  function glyph(k, gt, u) {
    if (k === 2) {
      const sp = eo(seg(gt, 0, 0.35)), cp = eo(seg(gt, 0.2, 0.35));
      const pulse = u >= 0 ? bump(cl(u / 0.6)) : 0, cu = u >= 0 ? cl((u - 0.15) / 0.5) : 1;
      const cx = +shG.dataset.cx, cy = +shG.dataset.cy;
      shG.setAttribute('transform', tf(cx, cy, Math.max(0.001, (0.5 + 0.5 * sp) * (1 - 0.12 * pulse))));
      shG.setAttribute('opacity', sp);
      shCk.setAttribute('stroke-dashoffset', (1 - (u >= 0 ? eo(cu) : cp)).toFixed(3));
      return;
    }
    gl[k].forEach(e => {
      const r = +e.dataset.r, cx = +e.dataset.cx, cy = +e.dataset.cy;
      let s = eo(seg(gt, r * 0.4, 0.28));
      if (u >= 0) s *= 1 - 0.55 * bump(cl((u - r * 0.35) / 0.55));
      s = Math.max(s, 0.001);
      e.setAttribute('transform', k === 0 ? tf(cx, cy, s) : `translate(0 ${cy}) scale(1 ${s}) translate(0 ${-cy})`);
    });
  }
  function render(t) {
    // ground
    const g = eo(seg(t, GROUND[0], GROUND[1]));
    const w = 1560 * g; gRect.setAttribute('x', 768 - w / 2); gRect.setAttribute('width', w);

    // loop clock
    const lt = t - LOOP0;
    const lc = lt >= 0 ? lt % PERIOD : -1;
    // highlight envelopes
    const hl = [0, 0, 0], hu = [-1, -1, -1];
    if (lc >= 0) hits.forEach(h => { const u = (lc - h.t) / HL; { hl[h.icon] = Math.max(hl[h.icon], bump(u)); if (u >= 0 && u < 1) hu[h.icon] = u; } });

    // buildings
    CFG.order.forEach((n, k) => {
      const p = eo(seg(t, BSTART + k * BSTEP, BDUR));
      const dy = RISE * (1 - p), s = 0.96 + 0.04 * p;
      const ti = iconBuilding.indexOf(n), h = ti >= 0 ? hl[ti] : 0;
      const sc = s * (1 + 0.012 * h);
      const tr = p <= 0 ? 'translate(0 2000)' : `translate(0 ${dy}) ` + tf(CFG.basex[n], 856, sc);
      groups[n].forEach(e => e.setAttribute('transform', tr));
      if (ti >= 0) { const e = tints[n]; e.setAttribute('transform', tr); e.setAttribute('opacity', (0.5 * h).toFixed(3)); }
    });

    // arcs
    arcm.forEach((e, i) => {
      const p = eio(seg(t, arcStart[i], arcDur[i]));
      e.setAttribute('stroke-dashoffset', (legLen[i] * (1 - p)).toFixed(2));
    });

    // nodes
    nodes.forEach((nd, k) => {
      const p = eo(seg(t, nodeT[k] - 0.2, NDUR));
      nd.el.setAttribute('opacity', p > 0 ? 1 : 0);
      nd.el.setAttribute('transform', tf(nd.x, nd.y, 0.2 + 0.8 * p) + '');
      if (p <= 0) nd.el.setAttribute('opacity', 0);
    });

    // icon bubbles
    bubs.forEach((b, k) => {
      const p = eo(seg(t, BUB0[k], BDUR2));
      const s = 0.82 + 0.18 * p;
      const hp = 1 + 0.08 * hl[k];
      b.el.setAttribute('opacity', p.toFixed(3));
      b.el.setAttribute('transform', tf(b.nx, b.ny, s) + ' ' + tf(b.cx, b.cy, k === 2 ? 1 : hp));
      glyph(k, t - BUB0[k] - 0.2, hu[k]);
    });

    // particle
    let op = 0, pos = null, sc = 1;
    if (lc >= 0) {
      for (const st of plan) {
        if (lc < st.t0 || lc > st.t1) continue;
        const u = (lc - st.t0) / (st.t1 - st.t0);
        if (st.kind === 'in') { pos = S[0]; op = eo(u); sc = 0.4 + 0.6 * eo(u); }
        else if (st.kind === 'out') { pos = st.s; op = 1 - eo(u); sc = 1 - 0.6 * eo(u); }
        else { pos = st.a + (st.b - st.a) * eio(u); op = 1; }
        break;
      }
      if (pos === null) { // dwell: sit at last position
        let last = plan.filter(p => p.t1 <= lc).pop();
        if (last) { pos = last.kind === 'move' ? last.b : last.kind === 'in' ? S[0] : null; op = pos === null ? 0 : 1; }
      }
    }
    if (pos !== null && op > 0) {
      const pt = route.getPointAtLength(cl(pos, 0, RL));
      particle.setAttribute('cx', pt.x.toFixed(2)); particle.setAttribute('cy', pt.y.toFixed(2));
      particle.setAttribute('r', (9 * sc).toFixed(2)); particle.setAttribute('opacity', op.toFixed(3));
    } else particle.setAttribute('opacity', 0);
  }

  const params = new URLSearchParams(location.search);
  if (params.get('bg')) document.body.dataset.bg = params.get('bg');
  if (params.has('dark')) document.querySelectorAll('.dk').forEach(e => e.removeAttribute('display'));
  let raf = 0, startAt = 0;
  const frame = now => { render((now - startAt) / 1000); raf = requestAnimationFrame(frame); };
  const play = () => { cancelAnimationFrame(raf); startAt = performance.now(); raf = requestAnimationFrame(frame); };
  const seek = t => { cancelAnimationFrame(raf); raf = 0; render(t); };
  svg.addEventListener('click', play);
  window.cityAnim = { play, seek, loopStart: LOOP0, period: PERIOD, hits, introEnd: BUB0[2] + BDUR2 + 0.4 };
  if (params.has('t')) seek(parseFloat(params.get('t')));
  else if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) seek(LOOP0 + 0.1);
  else play();
})();
</script>
</body>
</html>
