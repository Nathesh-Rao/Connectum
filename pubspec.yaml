name: connectum
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  # State, DI and routing
  get: ^4.7.3
  # REST client
  dio: ^5.11.1
  # Realtime connection to the backend
  web_socket_channel: ^3.0.3
  # Local database, the UI's source of truth
  sqflite: ^2.4.2+1
  # Building database file paths
  path: ^1.9.1
  # App documents directory for the database
  path_provider: ^2.1.6
  # Tokens and session secrets in Keystore/Keychain
  flutter_secure_storage: ^11.2.0
  # Online/offline state for AppStateView and reconnects
  connectivity_plus: ^7.3.2
  # Incoming App Links / Universal Links
  app_links: ^7.0.0
  lottie: ^3.3.3
  webcrypto: ^0.6.1
  mobile_scanner: 7.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: "branding/icon/legacy.png"
  android: "ic_launcher"
  min_sdk_android: 24
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "branding/icon/foreground.png"
  adaptive_icon_foreground_inset: 0
  ios: true
  image_path_ios: "branding/icon/ios.png"
  remove_alpha_ios: true
  background_color_ios: "#FFFFFF"

flutter:
  uses-material-design: true
  assets:
    - assets/images/connectum_logo.png
    - assets/images/states/
    - assets/lottie/
    - mobile-handoff/e2e-vectors.json
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
