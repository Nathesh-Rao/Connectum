  const edur = (len, sc) => Math.max(0.34, len / 330);
  const pushSeg = (a, b, t0, sc) => { const d = edur(dist(a, b), sc); E.push({ a, b, t0, d, sc }); return t0 + d; };
  const leaves = nodes.filter(n => n.lvl === 3).sort((a, b) => Math.atan2(a.y - 710, a.x - 770) - Math.atan2(b.y - 710, b.x - 770));
  const picks = [0, 5, 2, 7, 4, 9, 1, 6, 3, 8].map(i => Math.round(i * leaves.length / 10));
  const R0 = 6.9, RSTEP = 0.55;
  picks.slice(0, 10).forEach((pi, ri) => {
    const leaf = leaves[pi % leaves.length], path = []; for (let n = leaf; n; n = n.par) path.unshift(n);
    const depth = [4, 3, 4, 2, 4, 3, 4, 4, 3, 4][ri];
    let t = R0 + ri * RSTEP;
    const p0 = path[0], [a, b] = cn[p0.k];
    t = pushSeg(a, b, t, 1) + 0.1;
    for (let i = 1; i < Math.min(depth, path.length); i++) t = pushSeg(path[i].pa, path[i].pb, t, path[i].s) + 0.1;
  });
  pushSeg(cn.ch[0], cn.ch[1], 8.0, 1);
  const SLOTS = 9, slots = [];
  for (let i = 0; i < SLOTS; i++) {
    const g = mk('g', { opacity: 0, filter: 'url(#glow)' }, front);
    const trail = []; for (let j = 0; j < 8; j++) trail.push(mk('circle', { r: 6, fill: CYAN }, g));
    const halo = mk('circle', { r: 17, fill: CYAN, opacity: .5 }, g), head = mk('circle', { r: 8, fill: CYAN, stroke: '#fff', 'stroke-width': 3 }, g);
    slots.push({ g, trail, halo, head });
  }
  const erip = E.map(q => ({ t: q.t0 + q.d, sc: q.sc, e: mk('circle', { cx: q.b[0], cy: q.b[1], r: 10, fill: 'none', stroke: CYAN, 'stroke-width': 4 * Math.max(.5, q.sc), opacity: 0 }, front) }));
  const cps = []; const cT = [1.0]; for (let t = 3.8; t < 15; t += 2.3) cT.push(t);
  cT.forEach(t => cps.push({ t, e: mk('ellipse', { cx: 770, cy: 710, rx: 240, ry: 72, fill: 'none', stroke: CYAN, 'stroke-width': 5, opacity: 0 }, back_) }));

  function spawn(k, t) {
    const u = t - SPAWN[k], o = sfx[k], [cx, cy, rx, ry] = RING[k], e = av[k];
    const p = u <= 0 ? 0 : back(seg(u, 0, 0.7), 1.3), q = eo(seg(u, 0, 0.7));
    const idle = u > 0.9 ? Math.sin(t * 1.35 + cx * 0.01) * 2.4 * eo(seg(u, 0.9, 0.8)) : 0;
    e.setAttribute('opacity', eo(seg(u, 0, 0.22)).toFixed(3));
    e.setAttribute('transform', tf(cx, cy, 0.4 + 0.6 * p, 46 * (1 - q) + idle));
    o.flash.setAttribute('opacity', (0.5 * bump(seg(u, -0.05, 0.9))).toFixed(3));
    o.flash.setAttribute('transform', tf(cx, cy, 0.8 + 0.5 * seg(u, 0, 0.9)));
    o.rip.forEach((r, i) => { const v = seg(u, 0.04 + i * 0.2, 1.0), s = 0.55 + 1.1 * eo(v);
      r.setAttribute('opacity', (u > 0 && v < 1 ? 0.75 * (1 - v) : 0).toFixed(3)); r.setAttribute('transform', tf(cx, cy, s)); });
    o.dots.forEach((d, i) => { const n = o.dots.length, a = (i / n) * Math.PI * 2 + 0.3, v = eo(seg(u, 0.06, 0.85));
      d.setAttribute('cx', (cx + Math.cos(a) * rx * (0.6 + 0.7 * v)).toFixed(1));
      d.setAttribute('cy', (cy + Math.sin(a) * ry * (0.6 + 0.9 * v) - 50 * v).toFixed(1));
      d.setAttribute('r', (6 * (1 - v)).toFixed(2)); d.setAttribute('opacity', (u > 0 && v < 1 ? 1 : 0)); });
  }

  function render(t) {
    t = ((t % PERIOD) + PERIOD) % PERIOD;
    const o = seg(t, OUT0, OUT), sc = $('scene');
    sc.setAttribute('opacity', (1 - eo(o)).toFixed(3));
    sc.setAttribute('transform', tf(770, 512, 1 - 0.03 * eo(o)));

    ['c', ...KEYS].forEach(k => spawn(k, t));

    Object.keys(LNK).forEach(k => {
      const [s0, d] = LNK[k], p = eio(seg(t, s0, d)), [a, b] = cn[k], c = cmt[k];
      cm[k].e.setAttribute('stroke-dashoffset', (cm[k].len * (1 - p)).toFixed(2));
      const vis = t > s0 && t < s0 + d + 0.12;
      c.g.setAttribute('opacity', vis ? (1 - seg(t, s0 + d, 0.12)).toFixed(3) : 0);
      if (vis) {
        const h = lerp(a, b, p), tl = lerp(a, b, Math.max(0, p - 0.22));
        c.head.setAttribute('cx', h[0]); c.head.setAttribute('cy', h[1]); c.halo.setAttribute('cx', h[0]); c.halo.setAttribute('cy', h[1]);
        c.streak.setAttribute('x1', tl[0]); c.streak.setAttribute('y1', tl[1]); c.streak.setAttribute('x2', h[0]); c.streak.setAttribute('y2', h[1]);
      }
    });
    Object.keys(nrip).forEach(k => { const v = seg(t, nodeT[k], 0.7);
      nrip[k].setAttribute('opacity', (t > nodeT[k] && v < 1 ? 0.85 * (1 - v) : 0).toFixed(3)); nrip[k].setAttribute('r', (12 + 40 * eo(v)).toFixed(1)); });
    Object.keys(flowL).forEach(k => { const f = flowL[k], on = eo(seg(t, LS[k] + LD + 0.6, 0.8)) * (1 - eo(o));
      f.setAttribute('opacity', (0.8 * on).toFixed(3)); f.setAttribute('stroke-dashoffset', (-t * 26).toFixed(1)); });

    // icons: thrown out of the avatar the moment its link connects
    KEYS.forEach(k => {
      const e = ic[k], f = ifx[k], [x, y] = CFG.ic[k], S = HEAD[k];
      const u = t - THROW[k], on = u > 0, v = seg(u, 0, 0.8), ev = eo(v);
      const dx = (S[0] - x) * (1 - ev), dy = (S[1] - y) * (1 - ev) - 70 * Math.sin(Math.PI * ev);
      const float = on ? Math.sin(t * 1.6 + x * 0.02) * 3 * eo(seg(u, 0.9, 0.7)) : 0;
      const scl = (0.15 + 0.85 * (on ? back(v, 1.6) : 0)) * (1 + 0.05 * bump(seg(u, 0.7, 0.55)));
      e.setAttribute('opacity', eo(seg(u, 0, 0.15)).toFixed(3));
      e.setAttribute('transform', tf(x, y, scl, dy + float, -22 * (1 - ev), dx));
      const l = t - (THROW[k] + 0.62);   // landing effects
      const rest = 0.22 * eo(seg(l, 0.2, 0.8)) * (0.82 + 0.18 * Math.sin(t * 1.9 + y * 0.01));
      f.glow.setAttribute('opacity', l > 0 ? (Math.min(1, 0.42 * bump(seg(l, 0, 1.0)) + rest) * (1 - eo(o))).toFixed(3) : 0);
      f.glow.setAttribute('transform', tf(x, y, 0.6 + 0.6 * eo(seg(l, 0, 0.9)), float));
      f.rings.forEach((r, i) => { const w = seg(l, i * 0.22, 0.9);
        r.setAttribute('opacity', (l > 0 && w < 1 ? 0.7 * (1 - w) : 0).toFixed(3)); r.setAttribute('r', (44 + 62 * eo(w)).toFixed(1)); });
      f.stars.forEach((st, i) => { const w = eo(seg(l, (i % 3) * 0.05, 0.8)), a = i * (Math.PI * 2 / 7) + 0.4, d = 52 + 56 * w + (i % 2) * 12;
        st.setAttribute('opacity', (l > 0 && w < 1 ? 1 : 0));
        st.setAttribute('transform', `translate(${(x + Math.cos(a) * d).toFixed(1)} ${(y + Math.sin(a) * d * 0.9).toFixed(1)}) rotate(${w * 70}) scale(${(1.8 * (1 - w) + 0.1).toFixed(2)})`); });
    });

    // background people
    nodes.forEach(n => {
      if (!n.g) return;
      const lp = eio(seg(t, n.t0, 0.5)), u = t - n.ts, [rcx, rcy] = RING[n.k];
      n.line.setAttribute('stroke-dashoffset', (n.len * (1 - lp)).toFixed(1));
      n.line.setAttribute('opacity', (OPA[n.lvl] * (1 - eo(o))).toFixed(3));
      const hv = t > n.t0 && t < n.t0 + 0.62;
      n.head.setAttribute('opacity', hv ? (1 - seg(t, n.t0 + 0.5, 0.12)).toFixed(2) : 0);
      if (hv) { const h = lerp(n.pa, n.pb, lp); n.head.setAttribute('cx', h[0].toFixed(1)); n.head.setAttribute('cy', h[1].toFixed(1)); }
      const dp = back(seg(u, 0, 0.6), 1.2), dq = eo(seg(u, 0, 0.6)), dd = eo(seg(t, n.t0 + 0.3, 0.4));
      n.dot.setAttribute('opacity', (dd * OPA[n.lvl] * (1 - eo(o))).toFixed(3));
      n.dot.setAttribute('transform', tf(+n.dot.getAttribute('cx'), +n.dot.getAttribute('cy'), 0.4 + 0.6 * dd));
      const idle = u > 0.8 ? Math.sin(t * 1.2 + n.id * 0.9) * 2 * n.s * eo(seg(u, 0.8, 0.8)) : 0;
      const sc2 = n.s * (0.4 + 0.6 * (u > 0 ? dp : 0));
      n.g.setAttribute('transform', `translate(${n.x} ${n.y + 40 * n.s * (1 - dq) + idle}) scale(${sc2.toFixed(3)}) translate(${-rcx} ${-rcy})`);
      n.g.setAttribute('opacity', (OPA[n.lvl] * eo(seg(u, 0, 0.2)) * (1 - eo(o))).toFixed(3));
      const rv = seg(u, 0.03, 0.9);
      n.rip.setAttribute('opacity', (u > 0 && rv < 1 ? 0.6 * (1 - rv) : 0).toFixed(3));
      n.rip.setAttribute('transform', tf(n.x, n.y, 0.6 + 1.0 * eo(rv)));
    });
    lat.forEach(l => { const p = eio(seg(t, l.t0, 0.7)); l.el.setAttribute('stroke-dashoffset', (l.len * (1 - p)).toFixed(1)); l.el.setAttribute('opacity', (0.55 * (1 - eo(o))).toFixed(3)); });

    // electrons
    let si = 0;
    for (const q of E) {
      if (t < q.t0 || t > q.t0 + q.d || si >= SLOTS) continue;
      const S = slots[si++], u = (t - q.t0) / q.d, f = Math.min(eo(cl(u / 0.15)), 1 - eo(cl((u - 0.88) / 0.12))), k = 0.45 + 0.55 * q.sc;
      const h = lerp(q.a, q.b, u);
      S.g.setAttribute('opacity', f.toFixed(3));
      S.head.setAttribute('cx', h[0].toFixed(1)); S.head.setAttribute('cy', h[1].toFixed(1)); S.head.setAttribute('r', (8 * k).toFixed(2));
      S.halo.setAttribute('cx', h[0].toFixed(1)); S.halo.setAttribute('cy', h[1].toFixed(1)); S.halo.setAttribute('r', (17 * k).toFixed(2));
      S.trail.forEach((c, j) => { const w = Math.max(0, u - (j + 1) * 0.035 * (dist(q.a, q.b) > 150 ? 1 : 2)), p = lerp(q.a, q.b, w);
        c.setAttribute('cx', p[0].toFixed(1)); c.setAttribute('cy', p[1].toFixed(1));
        c.setAttribute('r', (7 * k * (1 - (j + 1) / 9)).toFixed(2)); c.setAttribute('opacity', (0.7 * (1 - (j + 1) / 9)).toFixed(2)); });
    }
    for (; si < SLOTS; si++) slots[si].g.setAttribute('opacity', 0);
    erip.forEach(r => { const v = seg(t, r.t, 0.7), k = 0.5 + 0.5 * r.sc; r.e.setAttribute('opacity', (t > r.t && v < 1 ? 0.8 * (1 - v) : 0).toFixed(3)); r.e.setAttribute('r', ((10 + 34 * eo(v)) * k).toFixed(1)); });
    cps.forEach(c => { const v = seg(t, c.t, 1.5); c.e.setAttribute('opacity', (t > c.t && v < 1 ? 0.4 * (1 - v) : 0).toFixed(3)); c.e.setAttribute('transform', tf(770, 710, 1 + 0.35 * eo(v))); });
  }

  const params = new URLSearchParams(location.search);
  if (params.get('bg')) document.body.dataset.bg = params.get('bg');
  let raf = 0, startAt = 0;
  const frame = now => { render((now - startAt) / 1000); raf = requestAnimationFrame(frame); };
  const play = () => { cancelAnimationFrame(raf); startAt = performance.now(); raf = requestAnimationFrame(frame); };
  const seek = t => { cancelAnimationFrame(raf); raf = 0; render(t); };
  $('stage').addEventListener('click', play);
  window.netAnim = { play, seek, period: PERIOD, nodes: nodes.length };
  if (params.has('t')) seek(parseFloat(params.get('t')));
  else if (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches) seek(14.5);
  else play();
})();
</script>
</body>
</html>
